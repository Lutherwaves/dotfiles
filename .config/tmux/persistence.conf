# Session persistence: tmux-resurrect saves the layout; on Linux, systemd starts, restores
# and periodically saves it (.config/systemd/user/tmux*.{service,timer}).
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-processes '"~claude"'   # relaunch claude incl. --resume args
set -g @resurrect-hook-post-save-layout '~/.config/tmux/hooks/resurrect-post-save-layout.sh'  # live claude ids + no-restore guard
set -g @resurrect-hook-post-restore-all 'tmux set -g @resurrect-restored 1'                  # unlocks saving
set -s exit-empty off   # tmux.service starts a bare server; it must outlive the restore
